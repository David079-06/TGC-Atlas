name: Verify source
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax, local UI references and secret patterns
        run: npm run check
      - name: Verify shop trust, identity matching and country constraints
        run: npm test
